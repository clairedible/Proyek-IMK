<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Desain · InfoKom HMDTIF</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-halaman="peran">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- Ikon asli dari file Figma -->
    <symbol id="logo" viewBox="0 0 56 51"><image href="assets/69146.svg" width="56" height="51"/></symbol>

    <symbol id="i-phone" viewBox="0 0 24 24"><image href="assets/54fbe.svg" width="24" height="24"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><image href="assets/e0886.svg" width="24" height="24"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><image href="assets/e6d93.svg" width="24" height="24"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><image href="assets/5f177.svg" width="24" height="24"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><image href="assets/1b2ef.svg" width="24" height="24"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><image href="assets/fa01b.svg" width="24" height="24"/></symbol>

    <!-- Ikon peran (Pilih Peran) -->
    <symbol id="i-doc" viewBox="0 0 24 24"><image href="assets/icon-pengaju.svg" width="24" height="24"/></symbol>
    <symbol id="i-megaphone" viewBox="0 0 24 24"><image href="assets/0c6de.svg" width="24" height="24"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><image href="assets/bce34.svg" width="24" height="24"/></symbol>

    <!-- Ikon modal -->
    <symbol id="i-ok" viewBox="0 0 24 24"><image href="assets/6f0ef.svg" width="24" height="24"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><image href="assets/6bb5d.svg" width="24" height="24"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><image href="assets/47fa3.svg" width="24" height="24"/></symbol>

    <!-- Ikon utilitas (tetap inline, sesuai Figma) -->
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
  </svg>

  <main class="halaman-login" id="halaman-peran">
    <div class="kartu-login lebar">
      <div class="merek"><img src="img/logo-infokom.png" alt="Logo InfoKom" class="logo"><span>InfoKom</span></div>
      <h1>Pilih Peran</h1>
      <p class="sub">Login sesuai peran kamu</p>

      <div class="pilihan-peran">
        <button type="button" class="kartu-peran p-biru" data-peran="pengaju">
          <span class="lingkaran"><svg class="ic"><use href="#i-doc"/></svg></span>
          <span>Masuk sebagai <strong>Pengaju</strong></span>
          <small>Ajukan kebutuhan publikasi Anda.</small>
          <em>Lanjut →</em>
        </button>
        <button type="button" class="kartu-peran p-hijau" data-peran="humas">
          <span class="lingkaran"><svg class="ic"><use href="#i-megaphone"/></svg></span>
          <span>Masuk sebagai <strong>Humas</strong></span>
          <small>Kelola komunikasi dan publikasi.</small>
          <em>Lanjut →</em>
        </button>
        <button type="button" class="kartu-peran p-oranye" data-peran="medkraf">
          <span class="lingkaran"><svg class="ic"><use href="#i-image"/></svg></span>
          <span>Masuk sebagai <strong>MedKraf</strong></span>
          <small>Tim desain InfoKom: kelola kebutuhan media kreatif.</small>
          <em>Lanjut →</em>
        </button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
